services:
  app:
    build: .
    image: ${DOCKERHUB_USERNAME:-local}/nodeapp:${IMAGE_TAG:-dev}
    container_name: nodeapp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: nodeapp
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: nodeapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: nodeapp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nodeapp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
