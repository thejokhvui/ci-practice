name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Завантажити код репозиторію
        uses: actions/checkout@v4

      - name: Встановити Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Встановити залежності
        run: npm install

      - name: Запустити тести
        run: npm test

      - name: Запустити білд
        run: npm run build

      - name: Зберегти результат білду як артефакт
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          if-no-files-found: error

      # Сервер стоїть за тунелем Cloudflare, тому SSH іде через cloudflared
      - name: Встановити cloudflared
        run: |
          curl -fsSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo install /tmp/cloudflared /usr/local/bin/cloudflared

      - name: Розшифрувати SSH-ключ
        run: |
          echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > ec2-key.pem
          chmod 600 ec2-key.pem

      - name: Скопіювати файли на сервер
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude 'ec2-key.pem' \
            -e "ssh -i ec2-key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o 'ProxyCommand=cloudflared access ssh --hostname %h'" \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/nodeapp/

      - name: Запустити застосунок на сервері
        run: |
          ssh -i ec2-key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o 'ProxyCommand=cloudflared access ssh --hostname %h' \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} bash -s << 'EOF'
          set -e
          cd ~/nodeapp
          npm install --omit=dev
          pm2 restart nodeapp || pm2 start index.js --name nodeapp
          pm2 save
          sleep 3
          curl -fsS http://localhost:3000/health
          EOF
